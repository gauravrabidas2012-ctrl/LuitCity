<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#080a0d">
<title>LUIT CITY | Trendix Studios</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080a0d;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
    user-select: none;
}

body {
    color: #ffffff;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #080a0d;
}

/* PORTRAIT BLOCKER */

#rotateScreen {
    position: fixed;
    inset: 0;
    background: #080a0d;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

.rotateIcon {
    font-size: 55px;
    margin-bottom: 25px;
    animation: rotatePhone 2s infinite ease-in-out;
}

.rotateText {
    font-size: 13px;
    letter-spacing: 5px;
    color: #e8edf2;
}

.rotateSub {
    margin-top: 12px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #777f89;
}

@keyframes rotatePhone {
    0%, 30% {
        transform: rotate(0deg);
    }
    70%, 100% {
        transform: rotate(90deg);
    }
}

/* LOADING */

#loading {
    position: fixed;
    inset: 0;
    background: #080a0d;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.loadingContent {
    text-align: center;
}

.loadingLogo {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 7px;
}

.loadingLine {
    width: 120px;
    height: 1px;
    background: #242b32;
    margin: 22px auto;
    overflow: hidden;
}

.loadingLine::after {
    content: "";
    display: block;
    height: 100%;
    width: 35%;
    background: #d7dde3;
    animation: loading 1.2s infinite ease-in-out;
}

.loadingText {
    font-size: 9px;
    letter-spacing: 3px;
    color: #707781;
}

@keyframes loading {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="rotateScreen">
    <div class="rotateIcon">▱</div>
    <div class="rotateText">ROTATE YOUR DEVICE</div>
    <div class="rotateSub">LUIT CITY REQUIRES LANDSCAPE MODE</div>
</div>

<div id="loading">
    <div class="loadingContent">
        <div class="loadingLogo">TRENDIX STUDIOS</div>
        <div class="loadingLine"></div>
        <div class="loadingText">INITIALIZING SYSTEMS</div>
    </div>
</div>

<script>

/* =====================================
   LUIT CITY — PART 1
   TRENDIX STUDIOS
===================================== */

"use strict";

/* ---------- CANVAS ---------- */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", {
    alpha: false,
    desynchronized: true
});

const rotateScreen = document.getElementById("rotateScreen");
const loadingScreen = document.getElementById("loading");

let W = 0;
let H = 0;
let DPR = 1;

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    DPR = Math.min(window.devicePixelRatio || 1, 1.5);

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

resize();

/* ---------- ENGINE ---------- */

const ENGINE = {

    running: true,

    screen: "intro",

    time: 0,

    delta: 0,

    fps: 0,

    lastFrame: 0,

    introTimer: 0,

    transition: 0,

    settings: {
        sound: true,
        quality: "HIGH"
    },

    world: {
        width: 6000,
        height: 6000
    },

    player: {
        x: 3000,
        y: 3000,
        angle: 0,
        speed: 0
    }
};

/* ---------- INPUT ---------- */

const INPUT = {

    keys: {},

    pointer: {
        x: 0,
        y: 0,
        down: false,
        tapped: false
    }
};

window.addEventListener("keydown", e => {

    INPUT.keys[e.key.toLowerCase()] = true;

});

window.addEventListener("keyup", e => {

    INPUT.keys[e.key.toLowerCase()] = false;

});

canvas.addEventListener("pointerdown", e => {

    INPUT.pointer.x = e.clientX;
    INPUT.pointer.y = e.clientY;
    INPUT.pointer.down = true;
    INPUT.pointer.tapped = true;

});

canvas.addEventListener("pointerup", e => {

    INPUT.pointer.x = e.clientX;
    INPUT.pointer.y = e.clientY;
    INPUT.pointer.down = false;

});

canvas.addEventListener("pointermove", e => {

    INPUT.pointer.x = e.clientX;
    INPUT.pointer.y = e.clientY;

});

/* ---------- UTILITIES ---------- */

function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

function lerp(a, b, t) {
    return a + (b - a) * t;
}

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function fade(value) {
    return clamp(value, 0, 1);
}

function easeOut(t) {
    t = clamp(t, 0, 1);
    return 1 - Math.pow(1 - t, 3);
}

function easeInOut(t) {
    t = clamp(t, 0, 1);
    return t * t * (3 - 2 * t);
}

/* ---------- LANDSCAPE + FULLSCREEN ---------- */

async function activateLandscape() {

    try {

        if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
        }

    } catch (e) {
        // Fullscreen may be restricted by the browser.
    }

    try {

        if (screen.orientation &&
            screen.orientation.lock) {

            await screen.orientation.lock("landscape");

        }

    } catch (e) {
        // Orientation lock is browser-dependent.
    }

    updateOrientation();
}

function updateOrientation() {

    const portrait = window.innerHeight > window.innerWidth;

    if (portrait) {

        rotateScreen.style.display = "flex";

    } else {

        rotateScreen.style.display = "none";

    }

}

/* ---------- DRAWING HELPERS ---------- */

function clear() {

    ctx.fillStyle = "#080a0d";
    ctx.fillRect(0, 0, W, H);

}

function text(str, x, y, size, color, spacing = 0, weight = "400") {

    ctx.fillStyle = color;

    ctx.font = `${weight} ${size}px Arial`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (!spacing) {

        ctx.fillText(str, x, y);

    } else {

        let total = 0;

        for (let i = 0; i < str.length; i++) {
            total += ctx.measureText(str[i]).width + spacing;
        }

        total -= spacing;

        let pos = x - total / 2;

        for (const char of str) {

            ctx.fillText(char, pos, y);

            pos += ctx.measureText(char).width + spacing;

        }

    }

}

function line(x1, y1, x2, y2, color, width = 1) {

    ctx.beginPath();

    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);

    ctx.strokeStyle = color;
    ctx.lineWidth = width;

    ctx.stroke();

}

function rect(x, y, w, h, color) {

    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);

}

function outlineRect(x, y, w, h, color, width = 1) {

    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.strokeRect(x, y, w, h);

}

/* ---------- BUTTONS ---------- */

const BUTTONS = [];

function button(label, x, y, w, h, selected = false) {

    BUTTONS.push({
        label,
        x,
        y,
        w,
        h
    });

    const hovering =
        INPUT.pointer.x >= x &&
        INPUT.pointer.x <= x + w &&
        INPUT.pointer.y >= y &&
        INPUT.pointer.y <= y + h;

    const active = selected || hovering;

    if (active) {

        rect(x, y, w, h, "#dce2e7");

        text(
            label,
            x + w / 2,
            y + h / 2,
            12,
            "#080a0d",
            2,
            "600"
        );

    } else {

        outlineRect(x, y, w, h, "#323a43");

        text(
            label,
            x + w / 2,
            y + h / 2,
            12,
            "#b7c0c9",
            2
        );

    }

}

function processButtons() {

    if (!INPUT.pointer.tapped) return;

    const px = INPUT.pointer.x;
    const py = INPUT.pointer.y;

    for (const b of BUTTONS) {

        if (
            px >= b.x &&
            px <= b.x + b.w &&
            py >= b.y &&
            py <= b.y + b.h
        ) {

            handleButton(b.label);

            break;

        }

    }

    INPUT.pointer.tapped = false;

}

/* ---------- INTRO ---------- */

function renderIntro() {

    clear();

    ENGINE.introTimer += ENGINE.delta;

    const t = ENGINE.introTimer;

    // Minimal cinematic lighting

    const gradient = ctx.createRadialGradient(
        W / 2, H / 2, 10,
        W / 2, H / 2, Math.max(W, H) * 0.6
    );

    gradient.addColorStop(0, "#111820");
    gradient.addColorStop(1, "#080a0d");

    rect(0, 0, W, H, "#080a0d");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Intro stage 1

    if (t < 3.2) {

        let alpha = 1;

        if (t < 0.5) alpha = t / 0.5;
        if (t > 2.5) alpha = 1 - (t - 2.5) / 0.7;

        ctx.globalAlpha = fade(alpha);

        text(
            "TRENDIX STUDIOS",
            W / 2,
            H / 2 - 8,
            Math.min(24, W * 0.035),
            "#edf1f4",
            7,
            "600"
        );

        line(
            W / 2 - 65,
            H / 2 + 35,
            W / 2 + 65,
            H / 2 + 35,
            "#3a434d"
        );

        text(
            "AN ORIGINAL GAME PRODUCTION",
            W / 2,
            H / 2 + 60,
            9,
            "#818b96",
            3
        );

        ctx.globalAlpha = 1;

    }

    // Intro stage 2

    if (t >= 3.2 && t < 7.2) {

        const local = t - 3.2;

        let alpha = 1;

        if (local < 0.7) alpha = local / 0.7;
        if (local > 3.2) alpha = 1 - (local - 3.2) / 0.8;

        ctx.globalAlpha = fade(alpha);

        text(
            "LUIT CITY",
            W / 2,
            H / 2 - 12,
            Math.min(60, W * 0.09),
            "#f2f4f6",
            7,
            "700"
        );

        text(
            "THE CITY KNOWS NO MERCY",
            W / 2,
            H / 2 + 42,
            10,
            "#8f9aa5",
            4
        );

        ctx.globalAlpha = 1;

    }

    // Continue to menu

    if (t >= 7.2) {

        ENGINE.screen = "menu";

        ENGINE.introTimer = 0;

    }

}

/* ---------- MAIN MENU ---------- */

function renderMenu() {

    clear();

    BUTTONS.length = 0;

    // Background

    const gradient = ctx.createLinearGradient(
        0, 0, W, H
    );

    gradient.addColorStop(0, "#10151b");
    gradient.addColorStop(0.5, "#090c10");
    gradient.addColorStop(1, "#080a0d");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Background decorative lines

    for (let i = 0; i < 7; i++) {

        const y = H * 0.2 + i * 35;

        line(
            W * 0.58,
            y,
            W,
            y,
            "#111820",
            1
        );

    }

    // Branding

    text(
        "TRENDIX STUDIOS",
        W * 0.16,
        H * 0.16,
        10,
        "#929ca7",
        4
    );

    line(
        W * 0.07,
        H * 0.21,
        W * 0.25,
        H * 0.21,
        "#343d47"
    );

    // Main title

    text(
        "LUIT CITY",
        W * 0.28,
        H * 0.46,
        Math.min(54, W * 0.075),
        "#edf1f5",
        4,
        "700"
    );

    text(
        "THE CITY KNOWS NO MERCY",
        W * 0.28,
        H * 0.55,
        10,
        "#808b97",
        4
    );

    // Menu buttons

    const bw = Math.min(230, W * 0.32);
    const bh = 43;
    const gap = 12;

    const startX = W * 0.66;
    const startY = H * 0.38;

    button(
        "NEW GAME",
        startX,
        startY,
        bw,
        bh
    );

    button(
        "SETTINGS",
        startX,
        startY + bh + gap,
        bw,
        bh
    );

    button(
        "CREDITS",
        startX,
        startY + (bh + gap) * 2,
        bw,
        bh
    );

    // Footer

    text(
        "ORIGINAL OPEN-WORLD PROJECT",
        W / 2,
        H - 27,
        9,
        "#505963",
        3
    );

    text(
        "VERSION 0.1",
        W - 65,
        H - 27,
        8,
        "#414951",
        2
    );

    processButtons();

}

/* ---------- SETTINGS ---------- */

function renderSettings() {

        H * 0.38,
        220,

    button(
        "QUALITY : " + ENGINE.settings.quality,

        "BACK",

}

function renderCredits() {

    text(

        H * 0.42,
        16,
        "#c4ccd4",
        5
    );

    text(
        "AN ORIGINAL GAME PROJECT",
        W / 2,
        H * 0.49,
        10,
        "#7d8791",
        3
    );

    text(
        "LUIT CITY",
        W / 2,
        H * 0.58,
        22,
        "#f0f3f5",

    );

        "BACK",

        H * 0.72,

    );

}

/* ---------- GAME SCREEN ---------- */

function renderGame() {

    clear();

    BUTTONS.length = 0;

    // Part 1 gameplay placeholder

    text(
        "LUIT CITY",
        W / 2,
        H * 0.30,
        34,
        "#edf1f5",
        5,
        "700"
    );

    text(

        W / 2,
        H * 0.43,
        11,

        4
    );

    );

    button(
        "RETURN TO MENU",
        W / 2 - 115,
        H * 0.68,
        230,
        45
    );

}

/* ---------- BUTTON ACTIONS ---------- */

function handleButton(label) {

    switch (label) {

        case "NEW GAME":

            activateLandscape();

            ENGINE.screen = "game";

            break;

        case "SETTINGS":

            ENGINE.screen = "settings";

            break;

        case "CREDITS":

            ENGINE.screen = "credits";

            break;

        case "BACK":

            ENGINE.screen = "menu";

            break;

        case "RETURN TO MENU":

            ENGINE.screen = "menu";

            break;

        default:

            if (label.startsWith("SOUND")) {

                ENGINE.settings.sound =
                    !ENGINE.settings.sound;

            }

            if (label.startsWith("QUALITY")) {

                ENGINE.settings.quality =
                    ENGINE.settings.quality === "HIGH"
                    ? "LOW"
                    : "HIGH";

            }

            break;

    }

}

/* ---------- FPS ---------- */

let fpsCounter = 0;
let fpsTimer = 0;

function calculateFPS(dt) {

    fpsTimer += dt;
    fpsCounter++;

    if (fpsTimer >= 1) {

        ENGINE.fps = fpsCounter;

        fpsCounter = 0;
        fpsTimer = 0;

    }

}

/* ---------- ENGINE UPDATE ---------- */

function update(dt) {

    ENGINE.delta = dt;
    ENGINE.time += dt;

    calculateFPS(dt);

    updateOrientation();

}

/* ---------- RENDER ---------- */

function render() {

    switch (ENGINE.screen) {

        case "intro":
            renderIntro();
            break;

        case "menu":
            renderMenu();
            break;

        case "settings":
            renderSettings();
            break;

        case "credits":
            renderCredits();
            break;

        case "game":
            renderGame();
            break;

    }

}

/* ---------- GAME LOOP ---------- */

function loop(timestamp) {

    if (!ENGINE.running) return;

    if (!ENGINE.lastFrame) {
        ENGINE.lastFrame = timestamp;
    }

    let dt = (timestamp - ENGINE.lastFrame) / 1000;

    ENGINE.lastFrame = timestamp;

    dt = clamp(dt, 0, 0.05);

    update(dt);

    render();

    requestAnimationFrame(loop);

}

/* ---------- BOOT ---------- */

function boot() {

    resize();

    setTimeout(() => {

        loadingScreen.style.opacity = "0";

        setTimeout(() => {

            loadingScreen.style.display = "none";

            ENGINE.screen = "intro";

            requestAnimationFrame(loop);

        }, 500);

    }, 1200);

}

boot();

/* ---------- VISIBILITY ---------
- */

document.addEventListener("visibilitychange", () => {

    ENGINE.lastFrame = 0;

});

window.addEventListener("contextmenu", e => {
    e.preventDefault();
});

/* =========================

function generateResidential(x, y, w, h) {
    const gap = 45;
    const blockW = 130;
    const blockH = 110;

    for (let bx = x; bx < x + w - blockW; bx += blockW + gap) {
        for (let by = y; by < y + h - blockH; by += blockH + gap) {
            addBuilding(
                bx + Math.random() * 12,
                by + Math.random() * 12,
                blockW - Math.random() * 20,
                blockH - Math.random() * 20,
                "residential"

}

/* =========================
   DISTRICTS
========================= */

function drawDistricts(ctx) {
    for (const d of CITY.districts) {
        ctx.fillStyle = d.color;
        ctx.fillRect(d.x, d.y, d.w, d.h);
    }
}

/* =========================
   PARKS
========================= */

function drawParks(ctx) {
    for (const p of CITY.parks) {
        ctx.fillStyle = "#294b34";
        ctx.fillRect(p.x, p.y, p.w, p.h);

        ctx.strokeStyle = "#395b40";
        ctx.lineWidth = 8;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
    }
}

/* =========================
   RIVER
========================= */

function drawRiver(ctx) {
    for (const river of CITY.water) {
        if (!river.points || river.points.length < 2) continue;

        ctx.beginPath();
        ctx.moveTo(river.points[0].x, river.points[0].y);

        for (let i = 1; i < river.points.length; i++) {
            ctx.lineTo(river.points[i].x, river.points[i].y);
        }

        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.lineWidth = river.width;
        ctx.strokeStyle = "#263e50";
        ctx.stroke();

        ctx.lineWidth = river.width * 0.88;
        ctx.strokeStyle = "#315b75";
        ctx.stroke();

        ctx.lineWidth = 5;
        ctx.strokeStyle = "rgba(125,180,200,0.12)";
        ctx.stroke();
    }
}

/* =========================
   ROADS
========================= */

function drawRoads(ctx) {
    for (const r of CITY.roads) {
        ctx.beginPath();
        ctx.moveTo(r.x1, r.y1);
        ctx.lineTo(r.x2, r.y2);

        ctx.lineCap = "butt";
        ctx.lineWidth = r.width;
        ctx.strokeStyle = r.type === "highway"
            ? "#25282c"
            : "#282a2d";

        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(r.x1, r.y1);
        ctx.lineTo(r.x2, r.y2);

        ctx.lineWidth = Math.max(2, r.width * 0.025);
        ctx.strokeStyle = "#414448";
        ctx.stroke();
    }
}

/* =========================
   BRIDGES
========================= */

function drawBridges(ctx) {
    for (const b of CITY.bridges) {
        ctx.save();

        ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
        ctx.rotate(b.angle || 0);

        ctx.fillStyle = "#494b4d";
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);

        ctx.fillStyle = "#26292c";
        ctx.fillRect(-b.w / 2, -b.h / 2 + 15, b.w, b.h - 30);

        ctx.strokeStyle = "#74787a";
        ctx.lineWidth = 5;

        ctx.beginPath();
        ctx.moveTo(-b.w / 2, -b.h / 2 + 10);
        ctx.lineTo(b.w / 2, -b.h / 2 + 10);
        ctx.moveTo(-b.w / 2, b.h / 2 - 10);
        ctx.lineTo(b.w / 2, b.h / 2 - 10);
        ctx.stroke();

        ctx.restore();
    }
}

/* =========================
   BUILDINGS
========================= */

function drawBuildings(ctx) {
    for (const b of CITY.buildings) {
        let baseColor;

        if (b.type === "residential") {
            baseColor = "#55504a";
        } else if (b.type === "commercial") {
            baseColor = "#62615b";
        } else {
            baseColor = "#4b4e50";
        }

        ctx.fillStyle = baseColor;
        ctx.fillRect(b.x, b.y, b.w, b.h);

        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.fillRect(b.x + b.w * 0.7, b.y, b.w * 0.3, b.h);

        ctx.strokeStyle = "#22272a";
        ctx.lineWidth = 5;
        ctx.strokeRect(b.x, b.y, b.w, b.h);

        /* Roof detail */

        ctx.fillStyle = "rgba(180,180,180,0.05)";
        ctx.fillRect(
            b.x + 10,
            b.y + 10,
            Math.max(0, b.w - 20),
            Math.max(0, b.h - 20)
        );
    }
}

/* =========================
   TREES
========================= */

function drawTrees(ctx) {
    for (const t of CITY.trees) {
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);

        ctx.fillStyle = "#23442e";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(
            t.x - t.size * 0.2,
            t.y - t.size * 0.2,
            t.size * 0.65,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#355e3b";
        ctx.fill();
    }
}

/* =========================
   RAILWAY
========================= */

function drawRailways(ctx) {
    for (const rail of CITY.railways) {
        if (!rail.points || rail.points.length < 2) continue;

        ctx.beginPath();
        ctx.moveTo(rail.points[0].x, rail.points[0].y);

        for (let i = 1; i < rail.points.length; i++) {
            ctx.lineTo(rail.points[i].x, rail.points[i].y);
        }

        ctx.lineWidth = 45;
        ctx.strokeStyle = "#252729";
        ctx.stroke();

        ctx.lineWidth = 5;
        ctx.strokeStyle = "#90908b";
        ctx.stroke();

        ctx.lineWidth = 3;
        ctx.strokeStyle = "#55585a";

        ctx.setLineDash([30, 25]);
        ctx.stroke();
        ctx.setLineDash([]);
    }
}

/* =========================
   AIRPORT
========================= */

function drawAirport(ctx) {
    ctx.fillStyle = "#343b40";
    ctx.fillRect(AIRPORT.x, AIRPORT.y, AIRPORT.w, AIRPORT.h);

    /* Runway */

    ctx.fillStyle = "#15191d";
    ctx.fillRect(
        AIRPORT.runway.x,
        AIRPORT.runway.y,
        AIRPORT.runway.w,
        AIRPORT.runway.h
    );

    /* Runway outline */

    ctx.strokeStyle = "#74787b";
    ctx.lineWidth = 6;
    ctx.strokeRect(
        AIRPORT.runway.x,
        AIRPORT.runway.y,
        AIRPORT.runway.w,
        AIRPORT.runway.h
    );

    /* Runway center markings */

    ctx.strokeStyle = "#c6c7c5";
    ctx.lineWidth = 8;
    ctx.setLineDash([45, 35]);

    ctx.beginPath();
    ctx.moveTo(
        AIRPORT.runway.x + 50,
        AIRPORT.runway.y + AIRPORT.runway.h / 2
    );

    ctx.lineTo(
        AIRPORT.runway.x + AIRPORT.runway.w - 50,
        AIRPORT.runway.y + AIRPORT.runway.h / 2
    );

    ctx.stroke();
    ctx.setLineDash([]);

    /* Terminal */

    ctx.fillStyle = "#666b6c";
    ctx.fillRect(
        AIRPORT.terminal.x,
        AIRPORT.terminal.y,
        AIRPORT.terminal.w,
        AIRPORT.terminal.h
    );

    ctx.fillStyle = "#383f43";
    ctx.fillRect(
        AIRPORT.terminal.x + 20,
        AIRPORT.terminal.y + 20,
        AIRPORT.terminal.w - 40,
        AIRPORT.terminal.h - 40
    );

    ctx.strokeStyle = "#858b8b";
    ctx.lineWidth = 8;
    ctx.strokeRect(
        AIRPORT.terminal.x,
        AIRPORT.terminal.y,
        AIRPORT.terminal.w,
        AIRPORT.terminal.h
    );

    /* Terminal label */

    ctx.fillStyle = "#d0d1ce";
    ctx.font = "bold 60px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "AIRPORT",
        AIRPORT.terminal.x + AIRPORT.terminal.w / 2,
        AIRPORT.terminal.y + AIRPORT.terminal.h / 2
    );

    ctx.textAlign = "left";
}

/* =========================
   LANDMARKS
========================= */

function drawLandmarks(ctx) {
    for (const l of CITY.landmarks) {
        let color = "#b9b5a6";

        switch (l.type) {
            case "hospital":
                color = "#a7b9bc";
                break;
            case "police":
                color = "#879eb5";
                break;
            case "mall":
                color = "#b8a88d";
                break;
            case "station":
                color = "#b6a58b";
                break;
            case "bus":
                color = "#a5a18e";
                break;
            case "fuel":
                color = "#b5a179";
                break;
            case "stadium":
                color = "#81958a";
                break;
            case "university":
                color = "#9eaa9c";
                break;
            case "park":
                color = "#719076";
                break;
            case "factory":
                color = "#92918b";
                break;
            case "tea":
                color = "#829879";
                break;
            case "fire":
                color = "#b18b76";
                break;
        }

        const size = 180;

        ctx.fillStyle = color;
        ctx.fillRect(
            l.x - size / 2,
            l.y - size / 2,
            size,
            size
        );

        ctx.strokeStyle = "#22282b";
        ctx.lineWidth = 8;
        ctx.strokeRect(
            l.x - size / 2,
            l.y - size / 2,
            size,
            size
        );

        ctx.fillStyle = "#e2e0d8";
        ctx.font = "bold 34px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            l.name,
            l.x,
            l.y + size / 2 + 45
        );

        ctx.textAlign = "left";
    }
}

/* =========================
   DISTRICT LABELS
========================= */

function drawDistrictLabels(ctx) {
    ctx.textAlign = "center";
    ctx.font = "bold 100px Arial";

    for (const d of CITY.districts) {
        ctx.fillStyle = "rgba(220,220,215,0.13)";

        ctx.fillText(
            d.name,
            d.x + d.w / 2,
            d.y + d.h / 2
        );
    }

    ctx.textAlign = "left";
}

/* =========================
   PLAYER MARKER
========================= */

function drawPlayerMarker(ctx) {
    ctx.save();

    ctx.translate(PLAYER.x, PLAYER.y);
    ctx.rotate(PLAYER.angle);

    ctx.fillStyle = "#e6e6df";

    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(12, 14);
    ctx.lineTo(0, 8);
    ctx.lineTo(-12, 14);
    ctx.closePath();

    ctx.fill();

    ctx.restore();
}

/* =========================
   CAMERA FOLLOW
========================= */

function updateCamera() {
    const viewW = canvas.width;
    const viewH = canvas.height;

    const targetX = PLAYER.x - viewW / (2 * CAMERA.zoom);
    const targetY = PLAYER.y - viewH / (2 * CAMERA.zoom);

    CAMERA.x += (targetX - CAMERA.x) * 0.08;
    CAMERA.y += (targetY - CAMERA.y) * 0.08;

    const maxX = Math.max(0, CITY.width - viewW / CAMERA.zoom);
    const maxY = Math.max(0, CITY.height - viewH / CAMERA.zoom);

    CAMERA.x = Math.max(0, Math.min(CAMERA.x, maxX));
    CAMERA.y = Math.max(0, Math.min(CAMERA.y, maxY));
}

/* =========================
   GAME HUD
========================= */

function drawCityHUD(ctx) {
    ctx.save();

    ctx.setTransform(1, 0, 0, 1, 0, 0);

    ctx.fillStyle = "rgba(12,15,18,0.75)";
    ctx.fillRect(25, 25, 360, 100);

    ctx.fillStyle = "#eeeeea";
    ctx.font = "bold 26px Arial";
    ctx.textAlign = "left";

    ctx.fillText("LUIT CITY", 45, 65);

    ctx.fillStyle = "#9da3a5";
    ctx.font = "18px Arial";
    ctx.fillText("THE CITY KNOWS NO MERCY", 45, 100);

    ctx.restore();
}

/* =========================
   WORLD RENDERER
========================= */

function renderGame() {
    const ctx = canvas.getContext("2d");

    updateCamera();

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();

    ctx.scale(CAMERA.zoom, CAMERA.zoom);
    ctx.translate(-CAMERA.x, -CAMERA.y);

    /* Base world */

    ctx.fillStyle = "#303832";
    ctx.fillRect(0, 0, CITY.width, CITY.height);

    /* Render layers */

    drawDistricts(ctx);
    drawParks(ctx);
    drawRiver(ctx);
    drawRoads(ctx);
    drawBridges(ctx);
    drawRailways(ctx);
    drawBuildings(ctx);
    drawAirport(ctx);
    drawTrees(ctx);
    drawLandmarks(ctx);
    drawDistrictLabels(ctx);
    drawPlayerMarker(ctx);

    ctx.restore();

    drawCityHUD(ctx);
}

function LC3_moveJoystick(e) {

    const cx = rect.left + rect.width / 2;

    let dy = e.clientY - cy;

    const max = rect.width * 0.32;
    const distance = Math.hypot(dx, dy);

    if (distance > max) {

        dx = dx / distance * max;
        dy = dy / distance * max;

    }

    LC3_INPUT.joyX = dx / max;
    LC3_INPUT.joyY = dy / max;

    LC3_INPUT.joystickActive =
        Math.hypot(LC3_INPUT.joyX, LC3_INPUT.joyY) > 0.12;

    LC3_KNOB.style.transform =
        `translate(${dx}px,${dy}px)`;
}

LC3_JOY.addEventListener("pointerdown", e => {

    if (!LC3_ACTIVE) return;

    e.preventDefault();

    LC3_POINTER = e.pointerId;

    LC3_JOY.setPointerCapture(e.pointerId);

    LC3_moveJoystick(e);

});

LC3_JOY.addEventListener("pointermove", e => {

    if (e.pointerId !== LC3_POINTER) return;

    LC3_moveJoystick(e);

});

function LC3_endJoystick(e) {

    if (e.pointerId !== LC3_POINTER) return;

    LC3_POINTER = null;
    LC3_resetJoystick();

}

LC3_JOY.addEventListener("pointerup", LC3_endJoystick);
LC3_JOY.addEventListener("pointercancel", LC3_endJoystick);

LC3_SPRINT.addEventListener("pointerdown", e => {

    if (!LC3_ACTIVE) return;

    e.preventDefault();

    LC3_INPUT.sprint = true;
    LC3_SPRINT.classList.add("active");

});

function LC3_endSprint() {

    LC3_INPUT.sprint = false;
    LC3_SPRINT.classList.remove("active");

}

LC3_SPRINT.addEventListener("pointercancel", LC3_endSprint);

/* ---------- CONTROL VISIBILITY ---------- */

function LC3_setActive(state) {

    LC3_ACTIVE = state;

    LC3_CONTROLS.style.display = state ? "block" : "none";

    if (!state) {

        LC3_INPUT.up = false;
        LC3_INPUT.down = false;
        LC3_INPUT.left = false;
        LC3_INPUT.right = false;
        LC3_INPUT.sprint = false;

        LC3_resetJoystick();
        LC3_endSprint();

        PLAYER.vx = 0;
        PLAYER.vy = 0;
        PLAYER.speed = 0;

    }

}

/* ---------- COLLISION ---------- */

function LC3_circleRect(cx, cy, radius, b) {

    const nearestX = clamp(cx, b.x, b.x + b.w);
    const nearestY = clamp(cy, b.y, b.y + b.h);

    const dx = cx - nearestX;
    const dy = cy - nearestY;

    return dx * dx + dy * dy < radius * radius;

}

function LC3_collides(x, y) {

    const r = PLAYER.radius;

    for (const b of CITY.buildings) {

        if (
            x + r < b.x ||
            x - r > b.x + b.w ||
            y + r < b.y ||
            y - r > b.y + b.h
        ) continue;

        if (LC3_circleRect(x, y, r, b))
            return true;

    }

    return false;

}

/* ---------- MOVEMENT INPUT ---------- */

function LC3_getInput() {

    let x = 0;
    let y = 0;

    if (LC3_INPUT.left) x -= 1;
    if (LC3_INPUT.right) x += 1;
    if (LC3_INPUT.up) y -= 1;
    if (LC3_INPUT.down) y += 1;

    if (LC3_INPUT.joystickActive) {

        x = LC3_INPUT.joyX;
        y = LC3_INPUT.joyY;

    }

    const magnitude = Math.hypot(x, y);

    if (magnitude > 1) {

        x /= magnitude;
        y /= magnitude;

    }

    return { x, y };

}

/* ---------- PLAYER UPDATE ---------- */

function LC3_updatePlayer(dt) {

    if (!LC3_ACTIVE || ENGINE.screen !== "game")
        return;

    const input = LC3_getInput();

    const moving = Math.hypot(input.x, input.y) > 0.08;

    const sprinting = moving && LC3_INPUT.sprint;

    const maxSpeed = sprinting
        ? LC3.walkSpeed * (LC3.sprintSpeed / LC3.walkSpeed)
        : LC3.walkSpeed;

    const targetVX = input.x * maxSpeed;
    const targetVY = input.y * maxSpeed;

    const accel = moving
        ? LC3.acceleration
        : LC3.friction;

    PLAYER.vx = lerp(
        PLAYER.vx,
        targetVX,
        Math.min(1, accel * dt / maxSpeed)
    );

    PLAYER.vy = lerp(
        PLAYER.vy,
        targetVY,
        Math.min(1, accel * dt / maxSpeed)
    );

    /* ---------- X COLLISION ---------- */

    let nextX = PLAYER.x + PLAYER.vx * dt;

    nextX = clamp(
        nextX,
        PLAYER.radius,
        CITY.width - PLAYER.radius
    );

    if (!LC3_collides(nextX, PLAYER.y)) {

        PLAYER.x = nextX;

    } else {

        PLAYER.vx = 0;

    }

    /* ---------- Y COLLISION ---------- */

    let nextY = PLAYER.y + PLAYER.vy * dt;

    nextY = clamp(
        nextY,
        PLAYER.radius,
        CITY.height - PLAYER.radius
    );

    if (!LC3_collides(PLAYER.x, nextY)) {

        PLAYER.y = nextY;

    } else {

        PLAYER.vy = 0;

    }

    /* ---------- ROTATION ---------- */

    if (moving) {

        const targetAngle = Math.atan2(input.y, input.x);

        let diff = targetAngle - PLAYER.angle;

        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        PLAYER.angle += diff * Math.min(1, LC3.turnSpeed * dt);

    }

    PLAYER.speed = Math.hypot(PLAYER.vx, PLAYER.vy);

    PLAYER.walking = moving && PLAYER.speed > 8;
    PLAYER.sprinting = sprinting && PLAYER.speed > 8;

}

/* ---------- VEHICLE CONFIG ---------- */

const LC4 = {
    maxSpeed: 430,
    reverseSpeed: 150,
    acceleration: 260,
    braking: 420,
    friction: 100,
    steering: 2.15,
    collisionRadius: 20
};

const LC4_VEHICLES = [];
let LC4_CURRENT = null;

/* ---------- VEHICLE FACTORY ---------- */

function LC4_createVehicle(x, y, angle, color, name) {

    return {
        x,
        y,
        angle,
        color,
        name,

        speed: 0,

        width: 42,

/* ---------- PARKED VEHICLES ---------- */

LC4_VEHICLES.push(
    LC4_createVehicle(3150, 3450, 0, "#687987", "SEDAN"),
    LC4_createVehicle(3250, 3450, 0, "#9b7555", "COUPE"),
    LC4_createVehicle(3350, 3450, 0, "#687b65", "SUV"),
    LC4_createVehicle(3450, 3450, 0, "#77717f", "SPORT"),
    LC4_createVehicle(3550, 3450, 0, "#a5a7a8", "HATCHBACK")
);

/* ---------- VEHICLE INPUT ---------- */

let LC4_INTERACT = false;

window.addEventListener("keydown", e => {

    if (e.key.toLowerCase() === "e" && !e.repeat) {
        LC4_INTERACT = true;
    }

});

/* ---------- NEAREST VEHICLE ---------- */

function LC4_nearestVehicle() {

    let nearest = null;
    let bestDistance = 85;

    for (const v of LC4_VEHICLES) {

        if (v.occupied) continue;

        const distance = Math.hypot(
            PLAYER.x - v.x,
            PLAYER.y - v.y
        );

        if (distance < bestDistance) {

            bestDistance = distance;
            nearest = v;

        }

    }

    return nearest;

}

/* ---------- ENTER VEHICLE ---------- */

function LC4_enterVehicle(v) {

    if (!v || LC4_CURRENT) return;

    LC4_CURRENT = v;

    v.occupied = true;
    v.engine = true;

    v.speed = 0;

    PLAYER.x = v.x;
    PLAYER.y = v.y;
    PLAYER.angle = v.angle;

    PLAYER.vx = 0;
    PLAYER.vy = 0;
    PLAYER.speed = 0;

}

/* ---------- EXIT VEHICLE ---------- */

function LC4_exitVehicle() {

    if (!LC4_CURRENT) return;

    const v = LC4_CURRENT;

    const sideX = Math.cos(v.angle + Math.PI / 2) * 38;
    const sideY = Math.sin(v.angle + Math.PI / 2) * 38;

    let exitX = v.x + sideX;
    let exitY = v.y + sideY;

    if (LC3_collides(exitX, exitY)) {

        exitX = v.x - sideX;
        exitY = v.y - sideY;

    }

    if (LC3_collides(exitX, exitY)) {

        return;

    }

    PLAYER.x = exitX;
    PLAYER.y = exitY;
    PLAYER.angle = v.angle;

    PLAYER.vx = 0;
    PLAYER.vy = 0;
    PLAYER.speed = 0;

    v.occupied = false;
    v.engine = false;

    LC4_CURRENT = null;

}

/* ---------- VEHICLE UPDATE ---------- */

function LC4_update(dt) {

    if (ENGINE.screen !== "game") return;

    /* Interaction */

    if (LC4_INTERACT) {

        LC4_INTERACT = false;

        if (LC4_CURRENT) {

            LC4_exitVehicle();

        } else {

            const nearby = LC4_nearestVehicle();

            if (nearby) LC4_enterVehicle(nearby);

        }

    }

    if (!LC4_CURRENT) return;

    const v = LC4_CURRENT;

    const input = LC3_getInput();

    /* Forward and reverse */

    if (input.y < -0.1) {

        v.speed += LC4.acceleration * dt;

    } else if (input.y > 0.1) {

        v.speed -= LC4.braking * dt;

    } else {

        if (v.speed > 0) {
            v.speed = Math.max(0, v.speed - LC4.friction * dt);
        }

        if (v.speed < 0) {
            v.speed = Math.min(0, v.speed + LC4.friction * dt);
        }

    }

    v.speed = clamp(
        v.speed,
        -LC4.reverseSpeed,
        LC4.maxSpeed
    );

    /* Steering */

    const speedFactor = Math.min(
        1,
        Math.abs(v.speed) / 90
    );

    if (Math.abs(v.speed) > 3) {

        v.angle +=
            input.x *
            LC4.steering *
            speedFactor *
            dt *
            (v.speed >= 0 ? 1 : -1);

    }

    /* Movement */

    const moveX = Math.cos(v.angle) * v.speed * dt;
    const moveY = Math.sin(v.angle) * v.speed * dt;

    const nextX = clamp(
        v.x + moveX,
        v.width,
        CITY.width - v.width
    );

    const nextY = clamp(
        v.y + moveY,
        v.height,
        CITY.height - v.height
    );

    /* Collision */

    if (!LC3_collides(nextX, v.y)) {

        v.x = nextX;

    } else {

        v.speed *= -0.18;

    }

    if (!LC3_collides(v.x, nextY)) {

        v.y = nextY;

    } else {

        v.speed *= -0.18;

    }

    PLAYER.x = v.x;
    PLAYER.y = v.y;
    PLAYER.angle = v.angle;

    PLAYER.vx = Math.cos(v.angle) * v.speed;
    PLAYER.vy = Math.sin(v.angle) * v.speed;

    PLAYER.speed = Math.abs(v.speed);

    PLAYER.walking = false;
    PLAYER.sprinting = false;

}

/* ---------- VEHICLE RENDER ---------- */

function LC4_drawVehicle(v) {

    ctx.save();

    ctx.translate(v.x, v.y);
    ctx.rotate(v.angle);

    const w = v.width;
    const h = v.height;

    /* Shadow */

    rect(
        -w / 2 + 4,
        -h / 2 + 5,
        w,
        h,
        "#11161b"
    );

    /* Body */

    rect(
        -w / 2,
        -h / 2,
        w,
        h,
        v.color
    );

    /* Cabin */

    rect(
        -w * 0.15,
        -h * 0.37,
        w * 0.43,
        h * 0.74,
        "#26333d"
    );

    /* Front windshield */

    rect(
        w * 0.18,
        -h * 0.32,
        w * 0.20,
        h * 0.64,
        "#8b9eac"
    );

    /* Rear windshield */

    rect(
        -w * 0.34,
        -h * 0.30,
        w * 0.12,
        h * 0.60,
        "#52616d"
    );

    /* Headlights */

    rect(
        w / 2 - 3,
        -h / 2 + 2,
        3,
        5,
        "#e5dfba"
    );

    rect(
        w / 2 - 3,
        h / 2 - 7,
        3,
        5,
        "#e5dfba"
    );

    /* Wheels */

    rect(-w * 0.28, -h / 2 - 2, 10, 4, "#111317");
    rect(w * 0.22, -h / 2 - 2, 10, 4, "#111317");
    rect(-w * 0.28, h / 2 - 2, 10, 4, "#111317");
    rect(w * 0.22, h / 2 - 2, 10, 4, "#111317");

    /* Occupied indicator */

    if (v === LC4_CURRENT) {

        outlineRect(
            -w / 2 - 3,
            -h / 2 - 3,
            w + 6,
            h + 6,
            "#d5e0e8",
            1
        );

    }

    ctx.restore();

}

function LC5_random(min, max) {

}

function LC5_distance(x1, y1, x2, y2) {
    return Math.hypot(x2 - x1, y2 - y1);
}

LC5.routes = [

/* ---------- CREATE TRAFFIC ---------- */

function LC5_createTraffic() {

    LC5.traffic = [];

    for (let i = 0; i < LC5.trafficCount; i++) {

        const route =
            LC5.routes[i % LC5.routes.length];

        const start =
            Math.floor(Math.random() * route.length);

        LC5.traffic.push({

            route: route,

            index: start,

            x: route[start].x,
            y: route[start].y,

            target: (start + 1) % route.length,

            speed: LC5_random(90, 155),

            angle: 0,

            color:
                LC5.carColors[
                    Math.floor(
                        Math.random() *
                        LC5.carColors.length
                    )
                ],

            width: 24,
            height: 42,

            active: true

        });

    }
}

function LC5_createPedestrians() {

    LC5.pedestrians = [];

    for (let i = 0; i < LC5.pedestrianCount; i++) {

        LC5.pedestrians.push({

            x: LC5_random(1600, 4400),
            y: LC5_random(1600, 4400),

            angle: LC5_random(0, Math.PI * 2),

            speed: LC5_random(18, 38),

}

LC5_init();

/* ---------- TRAFFIC UPDATE ---------- */

function LC5_updateTraffic(dt) {

    for (const car of LC5.traffic) {

        if (!car.active) continue;

        const target =
            car.route[car.target];

        const dx = target.x - car.x;
        const dy = target.y - car.y;

        const distance = Math.hypot(dx, dy);

        if (distance < 8) {

            car.index = car.target;

            car.target =
                (car.target + 1) %
                car.route.length;

            continue;
        }

        car.angle = Math.atan2(dy, dx);

        const move =
            Math.min(car.speed * dt, distance);

        car.x +=
            Math.cos(car.angle) * move;

        car.y +=
            Math.sin(car.angle) * move;

    }

}

/* ---------- PEDESTRIAN UPDATE ---------- */

function LC5_updatePedestrians(dt) {

    for (const npc of LC5.pedestrians) {

        npc.directionTimer -= dt;

        if (npc.directionTimer <= 0) {

            npc.angle += LC5_random(-1.5, 1.5);

            npc.directionTimer =
                LC5_random(1.5, 4);

        }

        npc.x +=
            Math.cos(npc.angle) *
            npc.speed * dt;

        npc.y +=
            Math.sin(npc.angle) *
            npc.speed * dt;

        // Keep NPCs inside city boundaries

        npc.x = Math.max(
            100,
            Math.min(CITY.width - 100, npc.x)
        );

        npc.y = Math.max(
            100,
            Math.min(CITY.height - 100, npc.y)
        );

    }

}

/* ---------- NPC UPDATE ---------- */

function LC5_update(dt) {

    if (!LC5.active) return;

    LC5_updateTraffic(dt);
    LC5_updatePedestrians(dt);

}

/* ---------- DRAW PEDESTRIANS ---------- */

function LC5_drawPedestrians() {

    for (const npc of LC5.pedestrians) {

        ctx.save();

        ctx.translate(npc.x, npc.y);
        ctx.rotate(npc.angle);

        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.22)";
        ctx.beginPath();
        ctx.ellipse(0, 2, 5, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Body
        ctx.fillStyle = npc.color;
        ctx.beginPath();
        ctx.arc(0, 0, npc.radius, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.fillStyle = "#c5a17c";
        ctx.beginPath();
        ctx.arc(0, -5, 3, 0, Math.PI * 2);
        ctx.fill();

        // Direction marker
        ctx.fillStyle = "#e5e5e5";
        ctx.fillRect(-1, -9, 2, 3);

        ctx.restore();

    }

}

/* ---------- MISSION START ---------- */

function LC6_startMission(id) {

    if (LC6.current) return;

    const mission =
        LC6.missions.find(m => m.id === id);

    if (!mission) return;

    if (LC6.completed.includes(id)) {
        LC6.notify("MISSION ALREADY COMPLETED");
        return;
    }

    LC6.current = {

        data: mission,

        timer: mission.time || 0,

        started: true

    };

    LC6.notify("MISSION STARTED: " + mission.name);

}

/* ---------- MISSION UPDATE ---------- */

function LC6_update(dt) {

    if (!LC6.active) return;

    LC6.messageTimer -= dt;

    if (!LC6.current) return;

    const mission = LC6.current.data;

    LC6.current.timer -= dt;

    const px = LC4_CURRENT
        ? LC4_CURRENT.x
        : PLAYER.x;

    const py = LC4_CURRENT
        ? LC4_CURRENT.y
        : PLAYER.y;

    const distance =
        LC5_distance(
            px,
            py,
            mission.target.x,
            mission.target.y
        );

    // Time failure
    if (
        mission.type === "timed" &&
        LC6.current.timer <= 0
    ) {

        LC6.current = null;

        LC6.notify("MISSION FAILED");

        return;

    }

    // Mission completion
    if (distance <= mission.radius) {

        LC6.completed.push(mission.id);

        LC6.totalReward += mission.reward;

        LC6.notify(
            "MISSION COMPLETE +" +
            mission.reward
        );

        LC6.current = null;

    }

}

/* ---------- NOTIFICATIONS ---------- */

LC6.notify = function(message) {

    LC6.message = message;

    LC6.messageTimer = 3.5;

};

/* ---------- MISSION MARKER ---------- */

function LC6_drawMarker() {

    if (!LC6.current) return;

    const target =
        LC6.current.data.target;

    const pulse =
        1 + Math.sin(ENGINE.time * 4) * 0.15;

    ctx.save();

    ctx.translate(target.x, target.y);

    ctx.scale(pulse, pulse);

    // Outer circle
    ctx.beginPath();
    ctx.arc(0, 0, 48, 0, Math.PI * 2);

    ctx.strokeStyle = "#e2c16b";
    ctx.lineWidth = 4;
    ctx.stroke();

    // Inner marker
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);

    ctx.fillStyle = "#e2c16b";
    ctx.fill();

    // Marker beam
    ctx.beginPath();
    ctx.moveTo(0, -48);
    ctx.lineTo(0, -125);

    ctx.strokeStyle = "rgba(226,193,107,0.55)";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.restore();

}

/* ---------- MISSION HUD ---------- */

function LC6_drawHUD() {

    if (ENGINE.screen !== "game") return;

    ctx.save();

    // Active mission
    if (LC6.current) {

        const mission = LC6.current.data;

        const boxX = 24;
        const boxY = 95;
        const boxW = 285;
        const boxH = 100;

        ctx.fillRect(boxX, boxY, boxW, boxH);

        ctx.strokeStyle = "#c7a45b";
        ctx.lineWidth = 1;
        ctx.strokeRect(boxX, boxY, boxW, boxH);

        ctx.textAlign = "left";

        ctx.fillStyle = "#d7b568";
        ctx.font = "bold 13px Arial";

        ctx.fillText(
            "ACTIVE MISSION",
            boxX + 15,
            boxY + 22
        );

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px Arial";

        ctx.fillText(
            mission.name,
            boxX + 15,
            boxY + 45
        );

        ctx.fillStyle = "#aeb5bc";
        ctx.font = "12px Arial";

        ctx.fillText(
            mission.description,
            boxX + 15,
            boxY + 65
        );

        if (mission.type === "timed") {

            ctx.fillStyle = "#d7b568";

            ctx.fillText(
                "TIME: " +
                Math.ceil(LC6.current.timer) +
                "s",
                boxX + 15,
                boxY + 85
            );

        }

    }

    // Notification
    if (LC6.messageTimer > 0) {

        ctx.textAlign = "center";

        ctx.fillStyle = "rgba(10,12,15,0.88)";
        ctx.fillRect(
            W / 2 - 190,
            65,

            45
        );

        ctx.strokeStyle = "#c7a45b";
        ctx.strokeRect(
            W / 2 - 190,
            65,
            380,
            45
        );

        ctx.fillStyle = "#e0c16b";
        ctx.font = "bold 14px Arial";

        ctx.fillText(
            LC6.message,
            W / 2,
            93
        );

    }

    ctx.restore();

}
